
name: Cloudlocal EXE Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract main.zip
        shell: pwsh
        run: |
          Expand-Archive -Path main.zip -DestinationPath source -Force
          $pkg = Get-ChildItem source -Filter package.json -Recurse | Select-Object -First 1
          if (!$pkg) {
            throw "package.json not found!"
          }
          "PROJECT_DIR=$($pkg.DirectoryName)" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npm install

      - name: Build Windows 32-bit EXE
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          npx electron-builder --win nsis --ia32

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cloudlocal-Windows-32bit
          path: source/**/dist/*.exe
          if-no-files-found: error
